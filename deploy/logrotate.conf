# ============================================================================
# AniList バッチ同期ログのローテーション設定例。
#
# 配置方法(EC2 上):
#   sudo cp deploy/logrotate.conf /etc/logrotate.d/kimi-no-anime-wa
#
# logrotate は多くのディストリビューションで cron(daily)により自動実行される
# ため、追加の cron 登録は不要。
# ============================================================================
/opt/kimi-no-anime-wa/logs/*.log {
  weekly
  rotate 8
  compress
  missingok
  notifempty
  # docker compose run のプロセスがログファイルを開いたままにしないため、
  # rename ではなく中身を切り詰める copytruncate を使う。
  copytruncate
}
